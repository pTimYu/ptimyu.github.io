settings:
  content:
    merge: true

media:
  - name: post-images
    label: Post Images
    input: static/images/posts
    output: /images/posts
    categories: [image]
  - name: gallery-images
    label: Gallery Images
    input: static/images/gallery
    output: /images/gallery
    categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    exclude: ["_index.md"]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: categories
        label: Category
        type: select
        required: true
        options:
          values: [Research, Science, Anime, Games, Travel, Personal]
          multiple: true
          min: 1
          max: 1
      - name: tags
        label: Tags
        type: string
        list: true
      - name: description
        label: Description
        type: text
      - name: cover
        label: Cover Image
        type: object
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: post-images
          - name: alt
            label: Alt Text
            type: string
      - name: showToc
        label: Show Table of Contents
        type: boolean
        default: false
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
  - name: about
    label: About
    type: file
    path: content/about.md
    format: toml-frontmatter
    delimiters: "+++"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: About Text
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
  - name: gallery
    label: Gallery
    type: file
    path: content/gallery/_index.md
    format: toml-frontmatter
    delimiters: "+++"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Introduction
        type: rich-text
        options:
          format: markdown
          media: false
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options:
              media: gallery-images
          - name: alt
            label: Alt Text
            type: string
          - name: caption
            label: Caption
            type: string
