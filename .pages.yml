settings:
  content:
    merge: true

media:
  input: static/images/posts
  output: /images/posts
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    exclude: ["_index.md"]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: categories
        label: Category
        type: select
        required: true
        options:
          values: [Research, Science, Anime, Games, Travel, Personal]
          multiple: true
          min: 1
          max: 1
      - name: tags
        label: Tags
        type: string
        list: true
      - name: description
        label: Description
        type: text
      - name: cover
        label: Cover Image
        type: object
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Alt Text
            type: string
      - name: showToc
        label: Show Table of Contents
        type: boolean
        default: false
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
